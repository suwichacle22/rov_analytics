<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · RoV Draft Extractor</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header class="top">
  <div class="top-left"><a class="brand" href="/">RoV Draft Extractor</a><nav class="crumbs"><span class="sep">/</span><span>Dashboard</span></nav></div>
  <div class="top-right">
    <a class="link" href="/">Matches</a>
    <a class="link" href="/teams">Teams</a>
    <a class="link" href="/heroes">Heroes</a>
  </div>
</header>

<main class="dash">
  <div class="dash-head">
    <h1 id="title">Dashboard</h1>
    <div class="filters">
      <label class="inline-field">Team <select id="f-team"></select></label>
      <label class="inline-field">Match type <select id="f-stage"></select></label>
    </div>
  </div>
  <p class="notice" id="notice" hidden></p>
  <div id="body"></div>
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="/static/dashboard.js"></script>
</body>
</html>
