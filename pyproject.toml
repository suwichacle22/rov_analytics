[project]
name = "rov-extractor"
version = "0.1.0"
description = "Local entry and validation tool for RoV pro draft data from broadcast screenshots"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "convex>=0.7",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10",
    "rapidocr-onnxruntime>=1.3",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
rov-extract = "rov_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rov_extractor"]
