[project]
name = "rov-analytics"
version = "0.1.0"
description = "Track pro Arena of Valor (RoV) players on the minimap from video and build positioning analytics."
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
rov = "rov_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rov_analytics"]
